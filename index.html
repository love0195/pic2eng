<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看图学英语 - 单词发音</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .category-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .category-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .category-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        .word-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .word-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .word-card:active {
            transform: scale(0.98);
        }

        .word-card.playing {
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .word-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            background: #f0f0f0;
        }

        .word-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .word-translation {
            font-size: 0.9rem;
            color: #666;
        }

        @media (max-width: 480px) {
            .word-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }

            .word-card {
                padding: 15px;
            }

            .word-image {
                height: 100px;
            }

            header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 看图学英语</h1>
            <p style="opacity: 0.9;">点击图片或单词即可发音</p>
        </header>

        <nav class="category-nav" id="categoryNav"></nav>

        <main class="word-grid" id="wordGrid"></main>
    </div>

    <script>
        const vocabularyData = {
            furniture: {
                name: '家具篇',
                words: [
                    { en: 'sofa', zh: '沙发' },
                    { en: 'table', zh: '桌子' },
                    { en: 'chair', zh: '椅子' },
                    { en: 'bed', zh: '床' },
                    { en: 'desk', zh: '书桌' },
                    { en: 'bookshelf', zh: '书架' },
                    { en: 'wardrobe', zh: '衣柜' },
                    { en: 'lamp', zh: '灯' },
                    { en: 'cabinet', zh: '橱柜' },
                    { en: 'stool', zh: '凳子' },
                    { en: 'cupboard', zh: '碗柜' },
                    { en: 'drawer', zh: '抽屉' }
                ]
            },
            appliances: {
                name: '电器篇',
                words: [
                    { en: 'refrigerator', zh: '冰箱' },
                    { en: 'television', zh: '电视' },
                    { en: 'washing', zh: '洗衣机' },
                    { en: 'microwave', zh: '微波炉' },
                    { en: 'oven', zh: '烤箱' },
                    { en: 'dishwasher', zh: '洗碗机' },
                    { en: 'airconditioner', zh: '空调' },
                    { en: 'computer', zh: '电脑' },
                    { en: 'fan', zh: '风扇' },
                    { en: 'heater', zh: '加热器' },
                    { en: 'coffee', zh: '咖啡机' },
                    { en: 'toaster', zh: '烤面包机' }
                ]
            },
            vehicles: {
                name: '交通篇',
                words: [
                    { en: 'car', zh: '汽车' },
                    { en: 'bus', zh: '公交车' },
                    { en: 'train', zh: '火车' },
                    { en: 'plane', zh: '飞机' },
                    { en: 'bicycle', zh: '自行车' },
                    { en: 'motorcycle', zh: '摩托车' },
                    { en: 'ship', zh: '船' },
                    { en: 'boat', zh: '小船' },
                    { en: 'taxi', zh: '出租车' },
                    { en: 'subway', zh: '地铁' },
                    { en: 'truck', zh: '卡车' },
                    { en: 'helicopter', zh: '直升机' }
                ]
            },
            animals: {
                name: '动物篇',
                words: [
                    { en: 'dog', zh: '狗' },
                    { en: 'cat', zh: '猫' },
                    { en: 'bird', zh: '鸟' },
                    { en: 'fish', zh: '鱼' },
                    { en: 'rabbit', zh: '兔子' },
                    { en: 'hamster', zh: '仓鼠' },
                    { en: 'parrot', zh: '鹦鹉' },
                    { en: 'turtle', zh: '乌龟' },
                    { en: 'snake', zh: '蛇' },
                    { en: 'elephant', zh: '大象' },
                    { en: 'monkey', zh: '猴子' },
                    { en: 'panda', zh: '熊猫' }
                ]
            },
            fruits: {
                name: '水果篇',
                words: [
                    { en: 'apple', zh: '苹果' },
                    { en: 'banana', zh: '香蕉' },
                    { en: 'orange', zh: '橙子' },
                    { en: 'grape', zh: '葡萄' },
                    { en: 'watermelon', zh: '西瓜' },
                    { en: 'strawberry', zh: '草莓' },
                    { en: 'pineapple', zh: '菠萝' },
                    { en: 'mango', zh: '芒果' },
                    { en: 'peach', zh: '桃子' },
                    { en: 'pear', zh: '梨' },
                    { en: 'lemon', zh: '柠檬' },
                    { en: 'cherry', zh: '樱桃' }
                ]
            }
        };

        let currentCategory = 'furniture';

        function init() {
            renderCategories();
            renderWords(currentCategory);
        }

        function renderCategories() {
            const nav = document.getElementById('categoryNav');
            nav.innerHTML = '';
            
            Object.keys(vocabularyData).forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'category-btn' + (key === currentCategory ? ' active' : '');
                btn.textContent = vocabularyData[key].name;
                btn.onclick = () => switchCategory(key);
                nav.appendChild(btn);
            });
        }

        function switchCategory(category) {
            currentCategory = category;
            renderCategories();
            renderWords(category);
        }

        function renderWords(category) {
            const grid = document.getElementById('wordGrid');
            grid.innerHTML = '';
            
            vocabularyData[category].words.forEach(word => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.onclick = () => playPronunciation(word.en, card);
                
                const img = document.createElement('img');
                img.className = 'word-image';
                img.src = `https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=${encodeURIComponent(`a simple cartoon illustration of a ${word.en}, white background, cute style, single object, detailed, colorful`}&image_size=square`;
                img.alt = word.en;
                img.loading = 'lazy';
                
                const text = document.createElement('div');
                text.className = 'word-text';
                text.textContent = word.en;
                
                const translation = document.createElement('div');
                translation.className = 'word-translation';
                translation.textContent = word.zh;
                
                card.appendChild(img);
                card.appendChild(text);
                card.appendChild(translation);
                grid.appendChild(card);
            });
        }

        function playPronunciation(word, cardElement) {
            cardElement.classList.add('playing');
            
            const audio = new Audio();
            audio.src = `http://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=2';
            
            audio.onended = () => {
                cardElement.classList.remove('playing');
            };
            
            audio.onerror = () => {
                audio.src = `https://api.dictionaryapi.dev/media/pronunciations/en/${encodeURIComponent(word)}-us.mp3`;
                audio.play().catch(() => {
                    cardElement.classList.remove('playing');
                });
            };
            
            audio.play().catch(() => {
                cardElement.classList.remove('playing');
            });
            
            setTimeout(() => {
                cardElement.classList.remove('playing');
            }, 1000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
